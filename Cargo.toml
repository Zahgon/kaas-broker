[workspace]
members  = ["crates/sk-codec"]
resolver = "2"

[workspace.package]
edition      = "2021"
license      = "Apache-2.0"
repository   = "https://github.com/Woestebanaan/skafka"
rust-version = "1.85"

[workspace.dependencies]
bytes      = "1.9"
thiserror  = "2.0"
crc32c     = "0.6"
proptest   = "1.6"

[workspace.lints.clippy]
unwrap_used              = "deny"
expect_used              = "deny"
panic                    = "deny"
as_conversions           = "deny"
cast_possible_truncation = "deny"
cast_sign_loss           = "deny"
